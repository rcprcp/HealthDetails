quarkus.http.port=8080

# PostgreSQL connection, matching the J2208 collector environment variables.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${J2208_PG_USER:bob}
quarkus.datasource.password=${J2208_PG_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:postgresql://${J2208_PG_HOST:127.0.0.1}:${J2208_PG_PORT:5432}/${J2208_PG_DATABASE:bob}?currentSchema=${J2208_PG_SCHEMA:j2208}&sslmode=${J2208_PG_SSLMODE:prefer}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8

# Must match J2208_PG_SCHEMA. Quoted in generated SQL and validated as an identifier.
healthdetails.schema=${J2208_PG_SCHEMA:j2208}

# Programmatic jobs are created from the monitor buttons, so start the
# scheduler even when there are no @Scheduled methods at boot.
quarkus.scheduler.start-mode=forced

quarkus.log.category."io.agroal".level=WARN

# The Vite dev server proxies /api to this server, so CORS is not needed for
# `npm run dev`. Uncomment these if you call the API from another origin.
#quarkus.http.cors=true
#quarkus.http.cors.origins=http://localhost:5173
